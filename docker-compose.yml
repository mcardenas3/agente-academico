services:
  # ---------- Base de datos principal ----------
  postgres:
    image: postgres:17                          # Imagen oficial de PostgreSQL, versión 17
    environment:                                # Con esto Postgres crea usuario y base al arrancar por primera vez
      POSTGRES_USER: ${POSTGRES_USER}           # Usuario administrador
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # Su contraseña
      POSTGRES_DB: ${POSTGRES_DB}               # Base de datos que se crea automáticamente
    ports:
      - "127.0.0.1:5432:5432"                   # "IP_local:puerto_tu_PC:puerto_contenedor"; 127.0.0.1 = solo accesible desde tu máquina, no desde la red
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Guarda los datos fuera del contenedor para que no se pierdan al reiniciarlo
    healthcheck:                                # Revisión periódica para saber si Postgres ya acepta conexiones
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]  # Comando que responde "listo" o "no listo"
      interval: 5s                              # Cada cuánto se ejecuta la revisión
      timeout: 3s                               # Cuánto espera la respuesta antes de darla por fallida
      retries: 10                               # Fallos seguidos permitidos antes de marcarlo "unhealthy"

  # ---------- Redis: almacenamiento en memoria (caché, colas, sesiones) ----------
  redis:
    image: redis:7                              # Imagen oficial de Redis, versión 7
    ports:
      - "127.0.0.1:6379:6379"                   # Puerto estándar de Redis, también solo local
    volumes:
      - redis_data:/data                        # Carpeta donde Redis guarda sus respaldos en disco
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]        # Si Redis está bien, responde "PONG"
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- OpenSearch: buscador (por palabras y por significado) ----------
  opensearch:
    image: opensearchproject/opensearch:3.9.0   # Versión fija: así todos corremos exactamente lo mismo
    environment:
      discovery.type: single-node               # Un solo servidor: no busca otros para formar un grupo (clúster)
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m" # Memoria mínima y máxima que puede usar; 512 MB basta para un artículo
      DISABLE_SECURITY_PLUGIN: "true"           # Sin usuario/contraseña ni HTTPS; aceptable porque solo es accesible localmente
      DISABLE_INSTALL_DEMO_CONFIG: "true"       # No instala los certificados de demostración (no se usan sin seguridad)
    ports:
      - "127.0.0.1:9200:9200"                   # Puerto donde OpenSearch recibe peticiones, también solo local
    volumes:
      - opensearch_data:/usr/share/opensearch/data  # Aquí viven los índices (los fragmentos del artículo)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]  # Pregunta por el estado del servidor
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s                         # Tiempo de gracia: OpenSearch tarda en arrancar y esos fallos no cuentan

  # ---------- Ollama: servidor del modelo de lenguaje (el que redacta las respuestas) ----------
  ollama:
    image: ollama/ollama:0.40.17                # Versión fija de Ollama, el programa que carga el modelo y lo atiende por HTTP
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"             # Cuánto texto cabe en una sola petición, medido en tokens (pedazos de palabra): pregunta + historial + fragmentos
      OLLAMA_KEEP_ALIVE: "-1"                   # Mantiene el modelo cargado en la tarjeta de video; por default lo saca tras 5 min sin uso y recargarlo tarda mucho
      LLAMA_ARG_CACHE_RAM: "1024"               # Tope (MiB) de la caché de prompts que llama-server (el motor de Ollama) guarda en RAM; por default es 8192 y crecía ~450 MB por pregunta hasta tumbar a Docker
    ports:
      - "127.0.0.1:11434:11434"                 # Puerto estándar de Ollama, también solo local
    volumes:
      - ollama_data:/root/.ollama               # Aquí quedan los modelos descargados (pesan varios GB) para no bajarlos otra vez
    deploy:                                     # Recursos de hardware que se le asignan al contenedor
      resources:
        reservations:                           # "Reservar": lo que el contenedor necesita para poder arrancar
          devices:
            - driver: nvidia                    # Usa el controlador de NVIDIA
              count: all                        # Todas las tarjetas de video disponibles (aquí solo hay una)
              capabilities: [gpu]               # Pide acceso a la tarjeta; equivale al "--gpus all" de "docker run"
    healthcheck:
      test: ["CMD", "ollama", "list"]           # Lista los modelos descargados; solo responde si el servidor ya está arriba
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s                         # Tiempo de gracia mientras arranca y detecta la tarjeta de video

  # ---------- vLLM: servidor del modelo de embeddings (convierte texto en vectores para poder buscar por significado) ----------
  vllm:
    image: vllm/vllm-openai:v0.25.0             # Versión fija de vLLM; es la que indica la ficha del modelo de embeddings
    command:                                    # Opciones con las que arranca vLLM (cada opción va seguida de su valor)
      - nvidia/Nemotron-3-Embed-1B-BF16         # Primero va el modelo que va a atender; la primera vez lo descarga de Hugging Face (2.3 GB)
      - --gpu-memory-utilization                # Fracción de la memoria de la tarjeta de video que puede tomar vLLM...
      - "0.45"                                  # ...45 % (unos 3.6 GB); sin este tope intenta tomar casi toda y choca con Ollama
      - --max-model-len                         # Largo máximo de un texto de entrada, en tokens...
      - "8192"                                  # ...8192 en vez de los 32768 que admite el modelo; sobra para un fragmento y ahorra memoria
    ports:
      - "127.0.0.1:8000:8000"                   # Puerto estándar de vLLM, también solo local
    volumes:
      - hf_cache:/root/.cache/huggingface       # Carpeta donde Hugging Face guarda lo descargado; así el modelo se baja una sola vez
    ipc: host                                   # Deja usar la memoria compartida del sistema; la necesita PyTorch, la librería con la que vLLM corre el modelo
    deploy:                                     # Mismo bloque que en Ollama: le presta la tarjeta de video al contenedor
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]  # Pide la página /health; da error mientras el modelo no termina de cargar
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s                        # Tiempo de gracia largo: la primera vez descarga el modelo antes de cargarlo

  # ---------- Descarga del LLM: corre una vez y termina ----------
  ollama-modelo:
    image: ollama/ollama:0.40.17                # La misma imagen de Ollama, usada solo como cliente
    environment:
      OLLAMA_HOST: http://ollama:11434          # Le habla al servidor "ollama"; el modelo queda en su volumen
    entrypoint: ["ollama", "pull", "nemotron-3-nano:4b"]  # Si ya está descargado, solo lo verifica (segundos)
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"                               # Es de una sola vez: no se reinicia al terminar

  # ---------- La aplicación: API de FastAPI + interfaz de React ----------
  app:
    build: .                                    # Se construye con el Dockerfile de la raíz
    environment:
      # Cada servicio se alcanza por su nombre dentro de la red de Docker
      URL_BASE_DATOS: "host=postgres port=5432 dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}"
      URL_REDIS: redis://redis:6379/0
      URL_OPENSEARCH: http://opensearch:9200
      URL_EMBED: http://vllm:8000/v2/embed
      URL_OLLAMA: http://ollama:11434/v1
      ADMIN_TOKEN: ${ADMIN_TOKEN}               # Token del panel /admin (en .env)
    ports:
      - "127.0.0.1:8080:8080"                   # La app en http://127.0.0.1:8080, solo local (afuera se entra por ngrok)
    depends_on:                                 # Arranca cuando todo lo demás ya responde
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      vllm: { condition: service_healthy }
      ollama: { condition: service_healthy }
      ollama-modelo: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/salud')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s                        # La primera vez arma el índice (~10 s) y calienta los modelos

  # ---------- ngrok: URL pública HTTPS hacia la app, para la demo ----------
  ngrok:
    image: ngrok/ngrok:3.39.13-alpine           # Versión fija del agente de ngrok
    entrypoint: ["/bin/sh", "-c"]               # Un shell, para agregar --url solo si hay dominio fijo
    # Publica el puerto 8080 del servicio "app"; con NGROK_URL usa siempre ese dominio, sin él uno aleatorio
    command: ["exec ngrok http app:8080 $${NGROK_URL:+--url $$NGROK_URL}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}       # Token de la cuenta de ngrok (en .env)
      NGROK_URL: ${NGROK_URL:-}                 # Dominio fijo de la cuenta, p. ej. https://algo.ngrok-free.dev (opcional)
    ports:
      - "127.0.0.1:4040:4040"                   # Panel local de ngrok: ahí aparece la URL pública
    depends_on:
      app:
        condition: service_healthy

# Volúmenes con nombre: Docker los administra y sobreviven a "docker compose down"
# (solo se borran con "docker compose down -v").
volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  ollama_data:
  hf_cache:
